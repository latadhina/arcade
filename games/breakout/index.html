<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Breakout — A LATA ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #141416;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      touch-action: none;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: calc(100vh - 48px);
      border-radius: 8px;
    }
    .bar {
      width: min(420px, 100vw);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c8c8c8;
      font-size: 14px;
    }
    .bar a { color: #9cf; text-decoration: none; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← A LATA ARCADE</a>
    <span>Move · smash bricks</span>
  </div>
  <canvas id="c" width="420" height="560"></canvas>
  <script src="../../products.js?v=8"></script>
  <script src="../../promo.js?v=8"></script>
  <script src="game.js?v=17"></script>
</body>
</html>
