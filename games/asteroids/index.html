<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Asteroids — A LATA ARCADE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #141416;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      touch-action: none;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: calc(100vh - 48px);
      border-radius: 8px;
    }
    .bar {
      width: min(480px, 100vw);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c8c8c8;
      font-size: 14px;
    }
    .bar a { color: #9cf; text-decoration: none; }
    .pad {
      width: min(480px, 100vw);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 8px 14px 12px;
    }
    .pad button {
      background: #22262e;
      color: #ddd;
      border: 2px solid #444;
      padding: 12px 8px;
      font-size: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← A LATA ARCADE</a>
    <span>← → thrust · Space fire</span>
  </div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="pad" aria-hidden="true">
    <button type="button" id="btn-left">◀</button>
    <button type="button" id="btn-thrust">THRUST</button>
    <button type="button" id="btn-right">▶</button>
  </div>
  <script src="../../products.js?v=8"></script>
  <script src="../../promo.js?v=8"></script>
  <script src="game.js?v=12"></script>
</body>
</html>
